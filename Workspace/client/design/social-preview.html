<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luxor Drive Social Preview</title>
    <style>
      :root {
        --background: #0a0b0d;
        --surface: #121418;
        --gold: #c5a572;
        --gold-light: #dcc6a0;
        --text: #f2f0eb;
        --muted: #a7a39c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--background);
        color: var(--text);
        font-family: "Avenir Next", "Century Gothic", "Segoe UI", sans-serif;
      }

      .preview {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 58px 64px 48px;
        isolation: isolate;
        background:
          radial-gradient(circle at 78% 18%, rgba(197, 165, 114, 0.13), transparent 29%),
          linear-gradient(145deg, #08090b 0%, #0d1015 52%, #11151c 100%);
      }

      .preview::before {
        content: "";
        position: absolute;
        z-index: -1;
        top: -190px;
        right: -70px;
        width: 590px;
        height: 590px;
        border: 1px solid rgba(197, 165, 114, 0.18);
        border-radius: 50%;
        box-shadow:
          0 0 0 58px rgba(197, 165, 114, 0.025),
          0 0 0 116px rgba(197, 165, 114, 0.018);
      }

      .preview::after {
        content: "";
        position: absolute;
        z-index: -1;
        top: 92px;
        right: -150px;
        width: 590px;
        height: 1px;
        opacity: 0.7;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        transform: rotate(-31deg);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 24px;
        color: var(--gold-light);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 42px;
        height: 1px;
        background: var(--gold);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      .brand-logo {
        width: 430px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.3));
      }

      .brand-copy {
        padding-left: 40px;
        border-left: 1px solid rgba(197, 165, 114, 0.28);
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: 52px;
        line-height: 1;
        letter-spacing: 0.035em;
      }

      .tagline {
        max-width: 430px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 22px;
        line-height: 1.45;
      }

      .reach {
        color: var(--gold-light);
      }

      .contact-bar {
        display: grid;
        grid-template-columns: 0.95fr 1.25fr 0.9fr;
        margin-top: auto;
        overflow: hidden;
        border: 1px solid rgba(197, 165, 114, 0.24);
        border-radius: 18px;
        background: rgba(18, 20, 24, 0.78);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.025);
      }

      .contact-item {
        min-width: 0;
        padding: 22px 25px 21px;
      }

      .contact-item + .contact-item {
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }

      .contact-label {
        display: block;
        margin-bottom: 7px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .contact-value {
        display: block;
        overflow: hidden;
        color: var(--text);
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <p class="eyebrow">Automobil &amp; Transport</p>

      <section class="brand" aria-label="Luxor Drive">
        <img
          class="brand-logo"
          src="../src/assets/Images/logo1.png"
          width="2064"
          height="512"
          alt="Luxor Drive"
        />
        <div class="brand-copy">
          <h1>Luxor Drive</h1>
          <p class="tagline">
            Professioneller Fahrzeugtransport<br />
            <span class="reach">deutschlandweit &amp; europaweit</span>
          </p>
        </div>
      </section>

      <section class="contact-bar" aria-label="Kontakt">
        <div class="contact-item">
          <span class="contact-label">Telefon</span>
          <span class="contact-value">+49 176 62581522</span>
        </div>
        <div class="contact-item">
          <span class="contact-label">E-Mail</span>
          <span class="contact-value">kontakt@luxor-drive.de</span>
        </div>
        <div class="contact-item">
          <span class="contact-label">Website</span>
          <span class="contact-value">luxor-drive.de</span>
        </div>
      </section>
    </main>
  </body>
</html>
